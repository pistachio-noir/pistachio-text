<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save as</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="--wallpaper:#0D0F09;--bg:#15170F;--bgAlt:#1D2016;--overlay:#2A2F1F;--overlay2:#39412A;--subtext:#A3B08F;--text:#E5E9D8;--textBright:#F6F8EF;--pistachio:#9FD88A;--terracotta:#DB8267;--gold:#E0B15E;--sageBlue:#7DA3B3;--teal:#7FC9A8;position:relative;width:960px;height:600px;box-sizing:border-box;padding:24px;background:var(--wallpaper);font-family:'Manrope',sans-serif;color:var(--text);overflow:hidden">

<div style="width:100%;height:100%;box-sizing:border-box;padding:20px;background:var(--bgAlt);border:1px solid var(--overlay2);border-radius:28px;display:flex;flex-direction:column;gap:14px" aria-hidden="true">
<div style="display:flex;gap:10px"><div style="width:190px;height:44px;border-radius:20px;background:var(--overlay)"></div><div style="flex-grow:1"></div><div style="width:120px;height:44px;border-radius:20px;background:var(--overlay)"></div><div style="width:120px;height:44px;border-radius:20px;background:var(--overlay)"></div></div>
<div style="flex-grow:1;border-radius:20px;background:var(--bg)"></div>
</div>

<div style="position:absolute;left:0;top:0;width:960px;height:600px;background:rgba(13,15,9,.66)"></div>

<div role="dialog" aria-label="Save as" style="position:absolute;left:260px;top:45px;width:440px;box-sizing:border-box;padding:28px;background:var(--bgAlt);border:1px solid var(--overlay2);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:14px">

<div style="display:flex;align-items:center;gap:14px">
<div style="width:44px;height:44px;border-radius:50%;background:var(--overlay2);display:flex;align-items:center;justify-content:center;color:var(--sageBlue)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
</div>
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-size:18px;font-weight:800;color:var(--textBright)">Save as</span>
<span style="font-size:12px;font-weight:500;line-height:17px;color:var(--subtext)">Name the file and choose a folder</span>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="fname" style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--subtext)">File name</label>
<div style="height:44px;box-sizing:border-box;padding:0 18px;background:var(--bg);border-radius:22px;display:flex;align-items:center">
<input id="fname" value="count_lines.rs" style="flex-grow:1;min-width:0;height:44px;border:0;outline:0;background:transparent;font-family:inherit;font-size:13px;font-weight:700;color:var(--textBright);caret-color:var(--pistachio)">
</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--subtext)">Folder</span>
<div style="height:44px;box-sizing:border-box;padding:0 16px;background:var(--bg);border-radius:22px;display:flex;align-items:center;gap:10px;color:var(--subtext)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></svg>
<span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:var(--text)">~/projects/notes</span>
</div>
</div>

<div style="padding:6px;background:var(--bg);border-radius:20px;display:flex;flex-direction:column;gap:6px">

<div style="height:44px;box-sizing:border-box;padding:0 14px;border-radius:16px;display:flex;align-items:center;gap:12px;color:var(--subtext)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
<span style="flex-grow:1;font-size:13px;font-weight:700;color:var(--text)">Parent folder</span>
</div>

<div style="height:44px;box-sizing:border-box;padding:0 14px;border-radius:16px;display:flex;align-items:center;gap:12px;color:var(--subtext)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></svg>
<span style="flex-grow:1;font-size:13px;font-weight:700;color:var(--text)">drafts</span>
<span style="font-size:11px;font-weight:600">Folder</span>
</div>

<div style="height:44px;box-sizing:border-box;padding:0 14px;border-radius:16px;display:flex;align-items:center;gap:12px;color:var(--subtext)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></svg>
<span style="flex-grow:1;font-size:13px;font-weight:700;color:var(--text)">snippets</span>
<span style="font-size:11px;font-weight:600">Folder</span>
</div>

</div>

<div style="display:flex;justify-content:flex-end;gap:10px;padding-top:14px;border-top:1px solid var(--overlay)">
<button style="height:44px;padding:0 22px;border:0;border-radius:22px;background:var(--overlay);color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">Cancel</button>
<button style="height:44px;padding:0 26px;border:0;border-radius:22px;background:var(--pistachio);color:var(--bg);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer">Save</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
