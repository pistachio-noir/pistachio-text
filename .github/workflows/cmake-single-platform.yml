# Based on GitHub's cmake-single-platform starter workflow.
name: CMake on a single platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install KF6 Syntax Highlighting
        run: |
          sudo apt-get update
          sudo apt-get install -y libkf6syntaxhighlighting-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          cache: true

      - name: Configure CMake
        run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }}

      - name: Test
        run: ctest --test-dir ${{ github.workspace }}/build --build-config ${{ env.BUILD_TYPE }} --output-on-failure
